<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #2b0836 0%, #170022 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    /* Tela Inicial */
    .screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 2.5rem;
      font-weight: normal;
    }

    button {
      padding: 10px 35px;
      font-size: 1rem;
      color: #fff;
      background: transparent;
      border: 1.5px solid #ff4d88;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ff4d88;
      box-shadow: 0 0 15px #ff4d88;
    }

    /* Tela do Cartão / Animação */
    #main-content {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 400px;
    }

    .typewriter-text {
      font-size: 1.1rem;
      line-height: 1.5;
      min-height: 70px;
      text-align: center;
    }

    /* Desenho com Canvas */
    canvas {
      width: 320px;
      height: 320px;
    }

    /* Contador */
    .counter-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .counter-time {
      font-weight: bold;
      margin-top: 5px;
      color: #ff99bb;
    }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="start-screen" class="screen">
    <h1>Flores e Gatinhos para ti 🐱🌻</h1>
    <button onclick="startExperience()">ABRIR</button>
  </div>

  <!-- Conteúdo Principal -->
  <div id="main-content" class="screen">
    <div class="typewriter-text" id="text"></div>
    
    <canvas id="flowerCanvas" width="320" height="320"></canvas>

    <div class="counter-box">
      <div>Meu amor por ti começou em:</div>
      <div class="counter-time" id="timer">0 dias 0h 0m 0s</div>
    </div>
  </div>

  <script>
    // Data do relacionamento (17 de Novembro de 2025)
    const startDate = new Date(2025, 10, 17, 0, 0, 0); 

    function startExperience() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'flex';

      startTypewriter();
      drawAnimation();
      setInterval(updateTimer, 1000);
      updateTimer();
    }

    // Texto de Amor
    const message = "O meu mundo ficou mais bonito no dia em que te encontrei... e desde então, só cresce o que sinto por ti. I love you Saruê 🐱❤️🌻";
    let index = 0;

    function startTypewriter() {
      if (index < message.length) {
        document.getElementById('text').innerHTML += message.charAt(index);
        index++;
        setTimeout(startTypewriter, 45);
      }
    }

    // Contador de Tempo
    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('timer').innerText = 
        `${days} dias ${hours}h ${minutes}m ${seconds}s`;
    }

    // Função para desenhar um Girassol
    function drawSunflower(ctx, cx, cy, size) {
      const petals = 12;
      ctx.fillStyle = '#ffcc00';
      for (let i = 0; i < petals; i++) {
        let angle = (i * Math.PI * 2) / petals;
        let px = cx + Math.cos(angle) * (size * 1.4);
        let py = cy + Math.sin(angle) * (size * 1.4);
        
        ctx.beginPath();
        ctx.arc(px, py, size / 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.fillStyle = '#5c3a21';
      ctx.arc(cx, cy, size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Função para desenhar um Gatinho Fofo sentado
    function drawCat(ctx, x, y, scale, flip = false) {
      ctx.save();
      ctx.translate(x, y);
      if (flip) ctx.scale(-1, 1);

      ctx.fillStyle = '#ffb3d9'; // Cor rosa suave para o gatinho
      
      // Corpo
      ctx.beginPath();
      ctx.ellipse(0, 0, 16 * scale, 25 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cabeça
      ctx.beginPath();
      ctx.arc(0, -28 * scale, 14 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Orelha Esquerda
      ctx.beginPath();
      ctx.moveTo(-12 * scale, -32 * scale);
      ctx.lineTo(-4 * scale, -45 * scale);
      ctx.lineTo(-1 * scale, -34 * scale);
      ctx.fill();

      // Orelha Direita
      ctx.beginPath();
      ctx.moveTo(12 * scale, -32 * scale);
      ctx.lineTo(4 * scale, -45 * scale);
      ctx.lineTo(1 * scale, -34 * scale);
      ctx.fill();

      // Rabinho Curvado
      ctx.beginPath();
      ctx.strokeStyle = '#ffb3d9';
      ctx.lineWidth = 4 * scale;
      ctx.lineCap = 'round';
      ctx.moveTo(-12 * scale, 10 * scale);
      ctx.bezierCurveTo(-30 * scale, 15 * scale, -25 * scale, -10 * scale, -20 * scale, -15 * scale);
      ctx.stroke();

      // Olhos e Bigodes (brancos)
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5 * scale;
      // Bigodes esquerdos
      ctx.beginPath();
      ctx.moveTo(-5 * scale, -26 * scale); ctx.lineTo(-18 * scale, -28 * scale);
      ctx.moveTo(-5 * scale, -24 * scale); ctx.lineTo(-18 * scale, -24 * scale);
      ctx.stroke();
      // Bigodes direitos
      ctx.beginPath();
      ctx.moveTo(5 * scale, -26 * scale); ctx.lineTo(18 * scale, -28 * scale);
      ctx.moveTo(5 * scale, -24 * scale); ctx.lineTo(18 * scale, -24 * scale);
      ctx.stroke();

      ctx.restore();
    }

    // Animação Principal
    function drawAnimation() {
      const canvas = document.getElementById('flowerCanvas');
      const ctx = canvas.getContext('2d');
      let progress = 0;

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Desenhar Gatinhos nas laterais
        if (progress > 0.2) {
          let catAlpha = Math.min((progress - 0.2) / 0.3, 1);
          ctx.globalAlpha = catAlpha;
          drawCat(ctx, 45, 275, 0.85, false); // Gatinho Esquerdo
          drawCat(ctx, 275, 275, 0.85, true);  // Gatinho Direito
          ctx.globalAlpha = 1.0;
        }

        // 2. Caule Principal
        ctx.beginPath();
        ctx.strokeStyle = '#2d8a4e';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.moveTo(160, 290);
        let stemHeight = Math.min(progress * 160, 160);
        ctx.lineTo(160, 290 - stemHeight);
        ctx.stroke();

        // 3. Ramos Laterais para Girassóis
        if (progress > 0.4) {
          ctx.lineWidth = 4;
          
          // Ramo Esquerdo
          ctx.beginPath();
          ctx.moveTo(160, 230);
          ctx.lineTo(100, 185);
          ctx.stroke();

          // Ramo Direito
          ctx.beginPath();
          ctx.moveTo(160, 210);
          ctx.lineTo(220, 165);
          ctx.stroke();
        }

        // 4. Desenhar Girassóis
        if (progress > 0.6) {
          let scale = Math.min((progress - 0.6) / 0.3, 1);
          drawSunflower(ctx, 100, 185, 11 * scale);
          drawSunflower(ctx, 220, 165, 11 * scale);
        }

        // 5. Desenhar Coração/Rosa Central
        if (progress > 0.7) {
          let heartProgress = (progress - 0.7) / 0.3;
          ctx.beginPath();
          ctx.strokeStyle = '#ff3366';
          ctx.lineWidth = 4;
          
          let points = [];
          for (let t = 0; t <= Math.PI * 2 * heartProgress; t += 0.05) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            points.push({ x: 160 + x * 3.5, y: 125 + y * 3.5 });
          }

          if (points.length > 0) {
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
              ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
          }
        }

        if (progress < 1) {
          progress += 0.008;
          requestAnimationFrame(animate);
        }
      }

      animate();
    }
  </script>
</body>
</html>
