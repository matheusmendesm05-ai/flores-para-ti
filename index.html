<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #2b0836 0%, #170022 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    /* Tela Inicial */
    .screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 2.5rem;
      font-weight: normal;
    }

    button {
      padding: 10px 35px;
      font-size: 1rem;
      color: #fff;
      background: transparent;
      border: 1.5px solid #ff4d88;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ff4d88;
      box-shadow: 0 0 15px #ff4d88;
    }

    /* Tela do Cartão / Animação */
    #main-content {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 90%;
      max-width: 400px;
    }

    .typewriter-text {
      font-size: 1.1rem;
      line-height: 1.5;
      min-height: 80px;
      text-align: center;
    }

    /* Desenho da Flor com Canvas */
    canvas {
      width: 280px;
      height: 280px;
    }

    /* Contador */
    .counter-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .counter-time {
      font-weight: bold;
      margin-top: 5px;
      color: #ff99bb;
    }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="start-screen" class="screen">
    <h1>Flores para ti 🌺</h1>
    <button onclick="startExperience()">ABRIR</button>
  </div>

  <!-- Conteúdo Principal -->
  <div id="main-content" class="screen">
    <div class="typewriter-text" id="text"></div>
    
    <canvas id="flowerCanvas" width="300" height="300"></canvas>

    <div class="counter-box">
      <div>Meu amor por ti começou em:</div>
      <div class="counter-time" id="timer">0 dias 0h 0m 0s</div>
    </div>
  </div>

  <script>
    // 1. Data de início do namoro/relacionamento (Ano, Mês [0-11], Dia, Hora, Minuto)
    // Nota: O mês de Novembro é representado pelo número 10 (pois Janeiro é 0)
    const startDate = new Date(2025, 10, 17, 0, 0, 0); 

    function startExperience() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'flex';

      startTypewriter();
      drawFlowerAnimation();
      setInterval(updateTimer, 1000);
      updateTimer();
    }

    // 2. Efeito de Texto a Escrever
    const message = "O meu mundo ficou mais bonito no dia em que te encontrei... e desde então, só cresce o que sinto por ti. I love you.";
    let index = 0;

    function startTypewriter() {
      if (index < message.length) {
        document.getElementById('text').innerHTML += message.charAt(index);
        index++;
        setTimeout(startTypewriter, 50);
      }
    }

    // 3. Contador de Tempo
    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('timer').innerText = 
        `${days} dias ${hours}h ${minutes}m ${seconds}s`;
    }

    // 4. Desenho Animado do Caule e Coração
    function drawFlowerAnimation() {
      const canvas = document.getElementById('flowerCanvas');
      const ctx = canvas.getContext('2d');
      let progress = 0;

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar Caule Verde
        ctx.beginPath();
        ctx.strokeStyle = '#2d8a4e';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.moveTo(150, 280);
        
        let stemHeight = Math.min(progress * 150, 150);
        ctx.lineTo(150, 280 - stemHeight);
        ctx.stroke();

        // Desenhar Ramos Pequenos
        if (progress > 0.4) {
          ctx.beginPath();
          ctx.lineWidth = 4;
          ctx.moveTo(150, 220);
          ctx.lineTo(130, 200);
          ctx.moveTo(150, 190);
          ctx.lineTo(170, 170);
          ctx.stroke();
        }

        // Desenhar Flor em Formato de Coração
        if (progress > 0.6) {
          let heartProgress = (progress - 0.6) / 0.4;
          ctx.beginPath();
          ctx.strokeStyle = '#ff3366';
          ctx.lineWidth = 4;
          
          let points = [];
          for (let t = 0; t <= Math.PI * 2 * heartProgress; t += 0.05) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            points.push({ x: 150 + x * 4, y: 130 + y * 4 });
          }

          if (points.length > 0) {
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
              ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
          }
        }

        if (progress < 1) {
          progress += 0.008;
          requestAnimationFrame(animate);
        }
      }

      animate();
    }
  </script>
</body>
</html>
